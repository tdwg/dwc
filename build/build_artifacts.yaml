# Rules for turning term IRIs into links in generated XML/documentation.
relation_styles:
  qrg:
    namespaces:
      http://rs.tdwg.org/dwc/terms/: https://dwc.tdwg.org/terms/#dwc:{name}
      http://rs.tdwg.org/dwc/iri/: https://dwc.tdwg.org/terms/#dwciri:{name}
      http://purl.org/dc/elements/1.1/: https://dwc.tdwg.org/terms/#dc:{name}
      http://purl.org/dc/terms/: https://dwc.tdwg.org/terms/#dcterms:{name}
      http://rs.tdwg.org/chrono/terms/: https://dwc.tdwg.org/terms/#chrono:{name}
      http://rs.tdwg.org/eco/terms/: https://dwc.tdwg.org/terms/#eco:{name}
  term_list:
    template: '{base}#{prefix}_{name}'
# Standard documents maintained by this build. update: false leaves both the
# current document and its archive untouched. document identifies the current
# Document whose processed metadata is read from the rs.tdwg.org registries.
documents:
# DARWIN CORE LIST OF TERMS
- name: Darwin Core List of Terms
  update: true
  renderer: term_list
  # Explicit reference to term_sources.darwin_core_list above. The included terms
  # span several namespaces, but together they are rendered as this one document.
  term_source_collection: darwin_core_list
  # Metadata belongs to the combined List of Terms document, not to the former
  # standalone eco: or chrono: term-list documents.
  document: http://rs.tdwg.org/dwc/doc/list/
  path: list
  vocab_type: 1
  header_template: list-template/termlist-header.{locale}.md
# ESTABLISHMENT MEANS LIST OF TERMS
- name: Establishment Means vocabulary
  update: true
  renderer: term_list
  artifact: Establishment Means vocabulary
  document: http://rs.tdwg.org/dwc/doc/em/
  path: em
  vocab_type: 2
  header_template: em-template/termlist-header.{locale}.md
# DEGREE OF ESTABLISHMENT LIST OF TERMS
- name: Degree of Establishment vocabulary
  update: true
  renderer: term_list
  artifact: Degree of Establishment vocabulary
  document: http://rs.tdwg.org/dwc/doc/doe/
  path: doe
  vocab_type: 2
  header_template: doe-template/termlist-header.{locale}.md
# PATHWAY LIST OF TERMS
- name: Pathway vocabulary
  update: true
  renderer: term_list
  artifact: Pathway vocabulary
  document: http://rs.tdwg.org/dwc/doc/pw/
  path: pw
  vocab_type: 3
  header_template: pw-template/termlist-header.{locale}.md
# TAXON COMPLETENESS REPORTED LIST OF TERMS
- name: Taxon Completeness Reported vocabulary
  update: true
  renderer: term_list
  artifact: Taxon Completeness Reported vocabulary
  document: http://rs.tdwg.org/dwc/doc/tcr/
