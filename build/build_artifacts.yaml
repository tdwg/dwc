  relation_style: qrg
- name: Humboldt extension
  update: true
  type: extension
  source:
    term_lists:
    - terms
    - humboldt
    document_metadata_path: dwc_doc_eco/
  template: dwca_template/humboldt_eco.tmpl
  term_list: dwca_template/humboldt_eco_list.csv
  output: dwca/extension/humboldt_
  relation_style: qrg
- name: Chronometric Age extension
  update: true
  type: extension
  source:
    term_lists:
    - terms
    - chronometricage
    document_metadata_path: dwc_doc_chrono/
  template: dwca_template/chronometric_age.tmpl
