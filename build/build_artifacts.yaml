  output: dwca/extension/chronometric_age_
  relation_style: qrg
- name: Establishment Means vocabulary
  update: true
  type: vocabulary
  source:
    term_lists:
    - establishmentMeans
    document_metadata_path: dwc_doc_em/
  template: dwca_template/establishment_means.tmpl
  gbif_alternatives: https://api.gbif.org/v1/vocabularies/EstablishmentMeans/concepts/%s/alternativeLabels
  vocabulary_cache: vocabularies/cache/EstablishmentMeans.json
  output: dwca/vocabulary/dwc/establishment_means_
- name: Degree of Establishment vocabulary
  update: true
  type: vocabulary
  source:
    term_lists:
    - degreeOfEstablishment
    document_metadata_path: dwc_doc_doe/
  template: dwca_template/degree_of_establishment.tmpl
  gbif_alternatives: https://api.gbif.org/v1/vocabularies/DegreeOfEstablishment/concepts/%s/alternativeLabels
  vocabulary_cache: vocabularies/cache/DegreeOfEstablishment.json
  output: dwca/vocabulary/dwc/degree_of_establishment_
- name: Pathway vocabulary
  update: true
  type: vocabulary
  source:
    term_lists:
    - pathway
    document_metadata_path: dwc_doc_pw/
  template: dwca_template/pathway.tmpl
  gbif_alternatives: https://api.gbif.org/v1/vocabularies/Pathway/concepts/%s/alternativeLabels
  vocabulary_cache: vocabularies/cache/Pathway.json
  output: dwca/vocabulary/dwc/pathway_
# Rules for turning term IRIs into links in generated XML/documentation.
relation_styles:
  qrg:
    namespaces:
      http://rs.tdwg.org/dwc/terms/: https://dwc.tdwg.org/terms/#dwc:{name}
      http://rs.tdwg.org/dwc/iri/: https://dwc.tdwg.org/terms/#dwciri:{name}
      http://purl.org/dc/elements/1.1/: https://dwc.tdwg.org/terms/#dc:{name}
      http://purl.org/dc/terms/: https://dwc.tdwg.org/terms/#dcterms:{name}
      http://purl.org/chrono/terms/: https://chrono.tdwg.org/terms/#chrono:{name}
      http://rs.tdwg.org/eco/terms/: https://eco.tdwg.org/terms/#eco:{name}
  term_list:
    template: '{base}#{prefix}_{name}'
# Standard documents maintained by this build. update: false leaves both the
# current document and its archive untouched. document_metadata_path selects the
# document's own authors_configuration.yaml and document_configuration.yaml.
documents:
- name: Darwin Core List of Terms
  update: true
  renderer: term_list
  # Explicit reference to term_sources.darwin_core_list above. The included terms
  # span several namespaces, but together they are rendered as this one document.
  term_source_collection: darwin_core_list
  # Metadata belongs to the combined List of Terms document, not to the former
  # standalone eco: or chrono: term-list documents.
  document_metadata_path: dwc_doc_list/
  path: list
  vocab_type: 1
  header_template: list-template/termlist-header.{locale}.md
- name: Establishment Means vocabulary
  update: true
  renderer: term_list
  artifact: Establishment Means vocabulary
  document_metadata_path: dwc_doc_em/
  path: em
  vocab_type: 2
  header_template: em-template/termlist-header.{locale}.md
- name: Degree of Establishment vocabulary
  update: true
  renderer: term_list
  artifact: Degree of Establishment vocabulary
  document_metadata_path: dwc_doc_doe/
  path: doe
  vocab_type: 2
  header_template: doe-template/termlist-header.{locale}.md
- name: Pathway vocabulary
  update: true
  renderer: term_list
  artifact: Pathway vocabulary
  document_metadata_path: dwc_doc_pw/
  path: pw
  vocab_type: 3
  header_template: pw-template/termlist-header.{locale}.md
- name: Darwin Core Conceptual Model
  update: false
  renderer: document_template
  document_metadata_path: dwc_doc_cm/
  path: cm
  template: dwc_doc_cm/index_template.md
- name: Darwin Core Data Package
  update: false
  renderer: document_template
  document_metadata_path: dwc_doc_dp/
  path: dp
  template: dwc_doc_dp/index_template.md
- name: Darwin Core RDF Guide
  update: false
  renderer: document_template
  document_metadata_path: dwc_terms_guides_rdf/
  path: rdf
  template: dwc_terms_guides_rdf/index_template.md
- name: Darwin Core Text Guide
  update: false
  renderer: document_template
  document_metadata_path: dwc_terms_guides_text/
  path: text
  template: dwc_terms_guides_text/index_template.md
- name: Darwin Core XML Guide
  update: false
  renderer: document_template
  document_metadata_path: dwc_terms_guides_xml/
  path: xml
  template: dwc_terms_guides_xml/index_template.md
- name: Darwin Core Namespace Policy
  update: false
  renderer: document_template
  document_metadata_path: dwc_terms_namespace/
  path: namespace
  template: dwc_terms_namespace/index_template.md
- name: Simple Darwin Core
  update: false
  renderer: document_template
  document_metadata_path: dwc_terms_simple/
  path: simple
  template: dwc_terms_simple/index_template.md
