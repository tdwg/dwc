# Darwin Core Data Package build inputs and destinations.
# Paths are repository-relative.
dwc_dp:
  version: http://rs.tdwg.org/dwc-dp/1.0-RC

  sources:
    tables: build/dwc-dp/dwc-dp-tables.csv
    fields: build/dwc-dp/dwc-dp-fields.csv

  profile:
    template: build/dwc-dp/dwc-dp-profile_template.json
    output: dwc-dp/dwc-dp-profile.json
    table_schemas: dwc-dp/table-schemas

  qrg:
    template: build/dwc-dp/qrg_template.html
    output: docs/dwc-dp/qrg/index.html
    images_source: build/dwc-dp/images
    images_output: docs/dwc-dp/images
  sql:
    config: build/dwc-dp/generate_sql.yaml
    output: dist/dwc-dp/dwc-dp.sql

  csv_headers:
    output: dist/dwc-dp/csv

  designer:
    template: build/dwc-dp/designer_template
    output: docs/dwc-dp/designer

