# Date assigned to any independently versioned artifact that this build
# determines requires a new version. Unchanged artifacts retain their
# existing published version and date.
release_date: 2026-09-17

# Authoritative source repository for term and document metadata.
# Set local_path to an rs.tdwg.org checkout for local/offline builds; otherwise
# github_user and github_branch identify the remote rs.tdwg.org source.
source_repository:
  github_user: tdwg
  github_branch: master
  local_path: null

# Named collections of term databases used by generated products. A collection
# identifies participating databases; recommendation/deprecation status is still
# determined from the term metadata itself.
term_sources:
  # Complete source population for the combined Darwin Core List of Terms and
  # products derived from that same population, including term_versions.csv.
  darwin_core_list:
  - terms
  - iri
  - dc-for-dwc
  - dcterms-for-dwc
  - ac-for-dwc
  - chronometricage
  - chronoiri
  - humboldt
  - humboldt_iri

# Complete version history. Current participating databases are taken from
# term_sources.darwin_core_list; only additional historical databases belong here.
term_versions:
  output: vocabulary/term_versions.csv
  term_source_collection: darwin_core_list
  historical_term_lists:
  - curatorial
  - dwcore
  - dwctype
  - geospatial
  obsolete_terms:
    versions: dwc-obsolete-versions/dwc-obsolete-versions.csv
    term_version_map: dwc-obsolete/dwc-obsolete-versions.csv
# Locales generated for localized term-list documents and the QRG.
languages:
- en
- ar
- cs
- de
- es
- fr
- ja
- ko
- pt
- ru
- zh-Hant
# Machine-readable Darwin Core artifacts. Each source declares both the term
# databases it consumes and the current Document IRI governing that artifact.
artifacts:
# DARWIN CORE EVENT CORE
- name: Darwin Core Event Core
  schema_label: Event
  update: true
  type: core
  source:
    term_lists:
    - terms
    - dc-for-dwc
    - dcterms-for-dwc
    - ac-for-dwc
    - humboldt
    document: http://rs.tdwg.org/dwc/doc/list/
  template: dwca_template/event_core.tmpl
  term_list: dwca_template/event_core_list.csv
  output: dwc-a/core/dwc_event_
  publication:
    canonical_path: dwc-a/schemas/core/event.xml
